[tool.poetry]
name = "phoenix-documentation"
version = "9999"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.12"
ablog = "==0.11.13"
doc8 = "==2.0.0"
docutils = "==0.21.2"
latex = "==0.7.0"
readthedocs-sphinx-ext = "^2"
sphinx = "==8.2.3"
sphinx-rtd-theme = "==3.0.2"
sphinx-hoverxref = "==1.0.1"
sphinx-notfound-page = "==1.0.2"
sphinx-tabs = "==3.4.5"
sphinx-version-warning = "==1.1.2"
sphinxcontrib-ghcontributors = "==0.2.3"
sphinxcontrib-serializinghtml = "==1.1.10"
sphinxcontrib-svg2pdfconverter = "==1.2.0"
sphinxext-delta = "==0.2.0"
sphinxext-linkcheckdiff = "==0.1.0"
sphinxext-mimic = "==0.1.1"
sphinxext-opengraph = "==0.10.0"
sphinxext-presentations = "==0.2.2"
sphinxext-rediraffe = "==0.2.5"
sphinxext-remoteliteralinclude = "==0.3.0"
sphinxext-toptranslators = "==0.1.3"

# Dependencies that often need to get updated
urllib3 = "==2.8.0"
jinja2 = "==3.1.6"
requests = "==2.34.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10"
